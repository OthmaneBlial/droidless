<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 710" role="img" aria-labelledby="title desc">
  <title id="title">Two saved Notepad entries reopened in DROIDLESS</title>
  <desc id="desc">Illustration based on the public Notepad APK's headless View tree: Hello, desktop and Native desktop test appear in Notes after a fresh process restart.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#19211e" flood-opacity=".16"/></filter>
  </defs>
  <rect width="520" height="710" rx="22" fill="#e9e7dc"/>
  <g fill="#adb2a4"><circle cx="25" cy="26" r="2"/><circle cx="48" cy="26" r="2"/><circle cx="71" cy="26" r="2"/><circle cx="25" cy="49" r="2"/><circle cx="48" cy="49" r="2"/><circle cx="71" cy="49" r="2"/><circle cx="448" cy="665" r="2"/><circle cx="471" cy="665" r="2"/><circle cx="494" cy="665" r="2"/></g>
  <g filter="url(#shadow)">
    <rect x="50" y="34" width="420" height="620" rx="14" fill="#fff" stroke="#17201c" stroke-width="2"/>
    <path d="M64 34h392a14 14 0 0 1 14 14v33H50V48a14 14 0 0 1 14-14Z" fill="#f6f5ef"/>
    <path d="M50 81h420" stroke="#d8d9d1"/>
    <circle cx="70" cy="57" r="5" fill="#dc6b4e"/><circle cx="87" cy="57" r="5" fill="#d9b84c"/><circle cx="104" cy="57" r="5" fill="#6d9c79"/>
    <text x="130" y="61" fill="#626a63" font-family="Chivo,Arial,sans-serif" font-size="12" font-weight="700">DROIDLESS  /  ORIGINAL APK</text>
    <rect x="50" y="82" width="420" height="570" fill="#fafafa"/>
    <rect x="50" y="82" width="420" height="58" fill="#fff"/>
    <text x="78" y="119" fill="#202722" font-family="Chivo,Arial,sans-serif" font-size="21" font-weight="750">Notes</text>
    <circle cx="438" cy="111" r="17" fill="#d9ff63"/>
    <path d="M438 102v18m-9-9h18" stroke="#202722" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M50 140h420" stroke="#d7d9d4"/>
    <text x="76" y="174" fill="#66716a" font-family="Chivo Mono,monospace" font-size="10" letter-spacing="1.2">YOUR NOTES</text>
    <rect x="70" y="190" width="380" height="112" rx="9" fill="#fff" stroke="#dfe2dc"/>
    <path d="M70 199a9 9 0 0 1 9-9h5v112h-5a9 9 0 0 1-9-9Z" fill="#d9ff63"/>
    <text x="103" y="229" fill="#202722" font-family="Chivo,Arial,sans-serif" font-size="18" font-weight="700">Hello, desktop</text>
    <path d="M103 251h291" stroke="#edf0ec"/>
    <text x="103" y="278" fill="#63746f" font-family="Chivo,Arial,sans-serif" font-size="12">Saved title · opened again</text>
    <rect x="70" y="322" width="380" height="112" rx="9" fill="#fff" stroke="#dfe2dc"/>
    <path d="M70 331a9 9 0 0 1 9-9h5v112h-5a9 9 0 0 1-9-9Z" fill="#d9ff63"/>
    <text x="103" y="361" fill="#202722" font-family="Chivo,Arial,sans-serif" font-size="16" font-weight="700">Native desktop test</text>
    <path d="M103 383h291" stroke="#edf0ec"/>
    <text x="103" y="410" fill="#63746f" font-family="Chivo,Arial,sans-serif" font-size="12">Keyboard entry · saved again</text>
    <path d="M70 450h380M70 566h380" stroke="#e4e6df" stroke-dasharray="3 7"/>
    <circle cx="413" cy="606" r="22" fill="#d9ff63"/>
    <path d="M413 596v20m-10-10h20" stroke="#202722" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="rotate(-5 386 677)">
    <rect x="293" y="655" width="190" height="34" rx="4" fill="#17201c"/>
    <text x="388" y="677" text-anchor="middle" fill="#f5f3e9" font-family="Chivo Mono,monospace" font-size="10" font-weight="700" letter-spacing=".5">✓  FRESH PROCESS</text>
  </g>
</svg>
