<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 255" role="img" aria-labelledby="title desc">
  <title id="title">From APK to native desktop</title>
  <desc id="desc">An APK enters DROIDLESS's format parsers, Rust DEX interpreter and Android API bridge, then native desktop controls. Input events return to the APK bytecode.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#171c21" stroke-width="1.5"/></marker></defs>
  <rect width="1120" height="255" rx="20" fill="#fffdf7"/>
  <g stroke="#171c21" stroke-width="2" fill="#d9ff63"><rect x="24" y="65" width="175" height="105" rx="12"/><rect x="255" y="65" width="224" height="105" rx="12"/><rect x="534" y="65" width="242" height="105" rx="12"/><rect x="832" y="65" width="263" height="105" rx="12" fill="#83b8ff"/></g>
  <g fill="#171c21" font-family="Chivo, Helvetica, sans-serif" text-anchor="middle"><text x="111" y="102" font-size="24" font-weight="800">Android APK</text><text x="111" y="136" font-family="monospace" font-size="13">ZIP / XML / DEX</text><text x="367" y="102" font-size="24" font-weight="800">Rust DEX VM</text><text x="367" y="136" font-family="monospace" font-size="13">Own interpreter + GC</text><text x="655" y="102" font-size="24" font-weight="800">Android API bridge</text><text x="655" y="136" font-family="monospace" font-size="13">Activity / resources / Views</text><text x="964" y="102" font-size="24" font-weight="800">Native desktop</text><text x="964" y="136" font-family="monospace" font-size="13">AppKit controls</text><text x="560" y="33" font-family="monospace" font-size="12" letter-spacing="2">DROIDLESS OWNS THE EXECUTION PATH</text></g>
  <g fill="none" stroke="#171c21" stroke-width="2" marker-end="url(#arrow)"><path d="M205 117h42"/><path d="M485 117h41"/><path d="M782 117h42"/><path d="M963 176v35H368v-33"/></g>
  <text x="662" y="238" font-family="monospace" text-anchor="middle" font-size="12" fill="#171c21">MOUSE / TEXT / KEY EVENTS → ORIGINAL APK CALLBACKS</text>
</svg>
